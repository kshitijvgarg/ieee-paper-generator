abstract: |
  Access to scholarships remains fragmented across portals, and students
  often miss opportunities that match their profile. This paper presents a
  recommendation system that matches student profiles against a curated
  scholarship database using collaborative filtering and content-based
  signals. We describe the dataset, model, and preliminary results, and
  discuss limitations and future extensions.

keywords:
  - scholarship
  - recommendation system
  - collaborative filtering
  - education

sections:
  - heading: "Introduction"
    body: "sample_intro.md"
  - heading: "Methodology"
    body: |
      We combine a user-item interaction matrix with content features
      extracted from scholarship eligibility text. The pipeline is trained
      on a sample of public scholarship listings stored in a local SQLite
      database.
    subsections:
      - heading: "Dataset"
        body: |
          The scholarship corpus contains anonymised listings with fields
          for domain, eligibility, deadline, and award amount. Student
          profiles contain demographic and academic attributes.
      - heading: "Model"
        body: |
          We use matrix factorisation with an auxiliary content tower
          that embeds eligibility text via a small transformer.
  - heading: "Results"
    body: |
      Preliminary results on a held-out test split show an improvement
      over a popularity-only baseline.
  - heading: "Conclusion"
    body: |
      The system shows promise as a first-line tool for matching students
      to relevant scholarships. Future work will expand the dataset and
      evaluate long-term engagement.

